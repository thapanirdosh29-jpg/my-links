<title>Nirdosh | Still Ascending</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#0d0d0d,#161616,#111);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:moveStars 60s linear infinite;
}

@keyframes moveStars{
from{
transform:translateY(0);
}
to{
transform:translateY(-500px);
}
}

.card{
position:relative;
z-index:2;
width:90%;
max-width:400px;
padding:30px;
text-align:center;

background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);

backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:0 0 30px rgba(255,255,255,0.05);
}

.profile{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
box-shadow:0 0 20px rgba(255,255,255,0.3);
}

h1{
margin-top:15px;
font-size:30px;
}

.bio{
margin-top:10px;
color:#bfbfbf;
line-height:1.6;
}

.link{
display:block;
margin-top:15px;
padding:15px;

text-decoration:none;
color:white;
font-weight:600;

background:rgba(255,255,255,0.08);

border-radius:15px;

transition:0.3s;
}

.link:hover{
transform:translateY(-5px);
background:rgba(255,255,255,0.15);
box-shadow:0 0 20px rgba(255,255,255,0.12);
}

.footer{
margin-top:25px;
font-size:13px;
color:#888;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="card">

class="profile"
src="https://via.placeholder.com/120"
